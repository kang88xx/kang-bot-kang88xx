name: Morning news briefing

on:
  schedule:
    # UTC 기준. 22:00 UTC = 한국시간 07:00 (GitHub 사정으로 몇 분 늦을 수 있음)
    - cron: "0 22 * * *"
  workflow_dispatch:   # Actions 탭에서 수동 실행용

permissions:
  contents: write

concurrency:
  group: morning-news
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build digest and send to KakaoTalk
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
        run: python main.py

      - name: Commit refreshed token and today's page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/kakao_token.enc docs
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 브리핑 $(TZ=Asia/Seoul date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
