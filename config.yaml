# 데일리 비서 브리핑 설정
# 이 파일만 고치면 섹션/피드/키워드/모델을 바꿀 수 있습니다.

timezone: Asia/Seoul

# 요약에 쓸 Claude 모델
model: claude-opus-5-5
# 요약 노력도: low | medium | high  (low면 가장 저렴, 뉴스 요약에는 충분)
effort: low

# 기사 수집 범위: 최근 N시간 이내 기사만 후보로 사용
max_age_hours: 24
# 섹션당 Claude에게 넘길 후보 기사 수 (많을수록 비용 증가)
max_candidates: 25
# 섹션당 최종 선별 기사 수 (텔레그램 메시지와 웹페이지에 표시)
per_section: 3

# 브리핑 웹페이지 주소. 비워두면 GitHub Pages 주소(https://<아이디>.github.io/<저장소>/)를 자동 사용
page_url: ""

sections:
  - key: crypto
    name: 크립토/블록체인
    emoji: "🪙"
    feeds:
      - https://www.tokenpost.kr/rss
      - https://www.blockmedia.co.kr/feed
      - https://news.google.com/rss/search?q=비트코인+OR+이더리움+OR+가상자산&hl=ko&gl=KR&ceid=KR:ko
  - key: economy
    name: 경제/주식
    emoji: "📈"
    feeds:
      - https://www.yna.co.kr/rss/economy.xml
      - https://www.yna.co.kr/rss/market.xml
      - https://www.hankyung.com/feed/economy
      - https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko
  - key: tech
    name: IT/AI
    emoji: "🤖"
    feeds:
      - https://rss.etnews.com/Section901.xml
      - https://www.hankyung.com/feed/it
      - https://news.google.com/rss/search?q=인공지능+OR+AI+OR+오픈AI+OR+엔비디아&hl=ko&gl=KR&ceid=KR:ko
      - https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=ko&gl=KR&ceid=KR:ko
  - key: korea
    name: 국내 주요 뉴스
    emoji: "🇰🇷"
    feeds:
      - https://www.yna.co.kr/rss/politics.xml
      - https://www.yna.co.kr/rss/society.xml
      - https://news.google.com/rss?hl=ko&gl=KR&ceid=KR:ko

# 매체명 표기: 기사 주소의 도메인 → 메시지에 보여줄 이름.
# 여기에 없는 도메인은 피드가 알려주는 이름을 정리해서 씁니다. 새 피드를 추가할 때 이름을 함께 적어 두세요.
source_names:
  tokenpost.kr: 토큰포스트
  blockmedia.co.kr: 블록미디어
  yna.co.kr: 연합뉴스
  hankyung.com: 한국경제
  etnews.com: 전자신문

# 관심 키워드. 키워드마다 구글 뉴스 검색 결과로 섹션이 하나씩 추가됩니다.
# 예시:
# keywords:
#   - 반도체
keywords: []
